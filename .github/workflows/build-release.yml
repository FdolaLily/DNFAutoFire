name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Zig compiler
        run: ./scripts/install-build-tools.ps1
      - name: Build and run all regression tests
        run: ./scripts/build.ps1 -OutputFile build/ci/DNFAutoFire.exe
      - name: Validate version and package release
        id: package
        run: ./scripts/package-release.ps1 -Source build/ci/DNFAutoFire.exe
      - name: Upload verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DNFAutoFire-${{ steps.package.outputs.tag }}-windows-x64
          path: |
            build/github-release/DNFAutoFire.exe
            build/github-release/DNFAutoFire-*.zip
            build/github-release/SHA256SUMS.txt
            build/github-release/release-notes.md
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DNFAutoFire-${{ needs.build.outputs.tag }}-windows-x64
          path: release
      - name: Publish new version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          # API failures must fail the job, not be mistaken for a missing release.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | {draft, target_commitish, html_url}")
          if [[ -n "$existing" ]]; then
            if [[ $(jq -r '.draft' <<< "$existing") == false ]]; then
              echo "Already published; keeping existing release: $(jq -r '.html_url' <<< "$existing")" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ $(jq -r '.target_commitish' <<< "$existing") != "$GITHUB_SHA" ]]; then
              echo 'An existing draft targets another commit; refusing to overwrite it.' >&2
              exit 1
            fi
          fi
          # An existing tag must point at exactly the tested source commit.
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")
          if [[ -n "$tags" ]]; then
            tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo 'Existing tag points to a different commit; refusing to publish mismatched binaries.' >&2
              exit 1
            fi
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "DNFAutoFire $RELEASE_TAG" --notes-file release-notes.md
          fi
          # Keep partial uploads in a draft; a retry may safely finish the same commit.
          gh release upload "$RELEASE_TAG" DNFAutoFire.exe "DNFAutoFire-$RELEASE_TAG-windows-x64.zip" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
